<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explain Visually</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-wrap" aria-label="Scene player">
        <iframe
          id="scene-frame"
          class="scene-frame"
          title="Current scene"
          sandbox="allow-scripts"
        ></iframe>
      </section>

      <footer class="controls" aria-label="Playback controls">
        <button id="previous-button" class="icon-button" type="button" aria-label="Previous scene" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 6h2v12H7zM10 12l9 6V6z"></path>
          </svg>
        </button>
        <button id="play-toggle-button" class="icon-button" type="button" aria-label="Play">
          <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"></path>
          </svg>
          <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5h4v14H7zM13 5h4v14h-4z"></path>
          </svg>
        </button>
        <button id="stop-button" class="icon-button" type="button" aria-label="Stop" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6h12v12H6z"></path>
          </svg>
        </button>
        <button id="next-button" class="icon-button" type="button" aria-label="Next scene" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 6v12l9-6zM15 6h2v12h-2z"></path>
          </svg>
        </button>
        <label class="theme-control" for="theme-select">
          <span>Theme</span>
          <select id="theme-select" class="theme-select" aria-label="Scene theme">
            <option value="default">Default</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <span id="scene-status" class="scene-status">0 / 0</span>
      </footer>
    </main>
  </body>
</html>
